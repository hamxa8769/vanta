# Vanta CI — test on Windows + Linux, build the Windows app (Phase 4).
# The build job runs PyInstaller on windows-latest and uploads the
# resulting Vanta folder + zip as an artifact (no GitHub release is
# created here — releases are made by hand, like the other apps).
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install system deps (Linux, headless Qt)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libegl1 libxkbcommon0 libdbus-1-3 \
            libfontconfig1 libglib2.0-0
      - name: Install package + dev deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install -r requirements-dev.txt
      - name: Run tests (headless)
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q

  build-windows:
    name: build Windows app
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package + PyInstaller
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pyinstaller
      - name: Build with PyInstaller
        run: pyinstaller --noconfirm vanta.spec
      - name: Zip the build
        shell: pwsh
        run: |
          $Version = (Get-Content VERSION -Raw).Trim()
          Compress-Archive -Path dist\Vanta -DestinationPath "dist\Vanta-$Version-Windows.zip"
          $Hash = (Get-FileHash "dist\Vanta-$Version-Windows.zip" -Algorithm SHA256).Hash.ToLower()
          "$Hash  Vanta-$Version-Windows.zip" | Out-File -Encoding ascii "dist\Vanta-$Version-Windows.zip.sha256"
          Get-ChildItem dist\Vanta\Vanta.exe
      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: Vanta-Windows
          path: |
            dist/Vanta/
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error
